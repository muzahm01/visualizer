[project]
name = "visualizer"
version = "0.1.2"
description = "A simple data visualization app for JSON and CSV files."
dependencies = [
    "streamlit>=1.18.0,<2.0.0",
    "pandas>=1.4.0,<3.0.0",
    "plotly>=5.0.0,<6.0.0",
    "pytest>=8.3.5,<9.0.0"
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["visualizer*"]
